name: 3DPets
version: ${version}
main: ai.resourcepack.pets3d.Pets3D
api-version: '1.21'
depend: [3DEngine]
description: A real 3D dog that follows you, sits and plays fetch. Built on 3D Engine.
website: https://resourcepack.ai
commands:
  pet:
    description: Summon or send home your dog; /pet sit, /pet ball.
    usage: /pet [sit|ball]
    permission: 3dpets.use
permissions:
  3dpets.use:
    description: Have a dog.
    default: true
  3dpets.admin:
    description: Both testing tools, /pet debug and /pet throw. A convenience parent, not a node anything checks.
    default: op
    children:
      3dpets.debug: true
      3dpets.throw: true
  3dpets.debug:
    description: /pet debug, turn fetch tracing on or off for every dog on the server (console and action bar; a testing tool).
    default: op
  3dpets.throw:
    description: /pet throw [blocks], land a ball ahead of you for your dog to fetch (a testing tool).
    default: op
  3dpets.update:
    description: Be told on joining when a newer 3D Pets is on SpigotMC.
    default: op
